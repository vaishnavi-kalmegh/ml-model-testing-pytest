[pytest]
addopts = -ra --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    bad_input: malformed or invalid input
    missing_data: NaN / missing columns
    dtype: wrong data types
    unseen_category: categories not seen in training
    quality: model quality and behaviour contracts
